<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpendSense: where did your money go?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBFBFA; --ink:#1D2B2A; --muted:#5F6B6A; --line:#DDE3E1; --bar:#0E7C66; --bar-bg:#E7EEEC;
  --leak:#B45309; --leak-bg:#FDF3E7; --panel:#FFFFFF; --btn:#1D2B2A; --btn-ink:#FFFFFF;
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root{
  --paper:#111816; --ink:#E4ECEA; --muted:#98A6A3; --line:#26332F; --bar:#3FBF9F; --bar-bg:#1C2724;
  --leak:#F0A45A; --leak-bg:#2A1F12; --panel:#161F1D; --btn:#E4ECEA; --btn-ink:#111816; } }
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--paper); color:var(--ink); line-height:1.5; font-size:1rem}
main{max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 4rem}
.num{font-variant-numeric:tabular-nums}
h1{font-size:clamp(1.8rem,5vw,2.4rem); font-weight:600; line-height:1.15; margin:0 0 .5rem}
h2{font-size:1.15rem; font-weight:600; margin:2.75rem 0 .25rem}
.sub{color:var(--muted); margin:0 0 1rem}
.lede{color:var(--muted); margin:0 0 1.5rem; max-width:36rem}
.controls{display:flex; flex-wrap:wrap; gap:.75rem; align-items:center}
.primary,.secondary{font:inherit; font-weight:500; border-radius:.6rem; padding:.7rem 1.2rem; cursor:pointer}
.primary{background:var(--btn); color:var(--btn-ink); border:0}
.secondary{background:transparent; color:var(--ink); border:1px solid var(--line)}
.secondary:hover{border-color:var(--ink)}
button:focus-visible, select:focus-visible, label.primary:focus-within{outline:3px solid var(--ink); outline-offset:3px}
input[type=file]{position:absolute; opacity:0; width:1px; height:1px}
.notice{background:var(--leak-bg); border:1px solid color-mix(in srgb,var(--leak) 35%,transparent); border-radius:.6rem;
  padding:.75rem 1rem; margin:0 0 1.75rem; font-size:.95rem}
.notice strong{display:block; margin-bottom:.15rem}
#mode{display:block; color:var(--muted); font-size:.85rem; margin-top:.35rem}
.hint a{color:var(--ink)}
.link{font:inherit; font-size:inherit; background:none; border:0; padding:0; margin-left:.5rem; color:var(--muted); text-decoration:underline; cursor:pointer}
.hint{color:var(--muted); font-size:.9rem; margin:.75rem 0 0}
.error{color:#B42318; margin-top:1rem}

.headline{font-size:clamp(1.45rem,4.2vw,1.95rem); line-height:1.3; font-weight:500; margin:2.5rem 0 .5rem; max-width:38rem}
.total{font-size:1.25rem; margin:.75rem 0 .15rem}
.total strong{font-weight:700; font-size:1.6rem}
.period{color:var(--muted); margin:0}

.leaks{list-style:none; padding:0; margin:1rem 0 0}
.leak{background:var(--leak-bg); border-left:4px solid var(--leak); padding:.9rem 1rem; margin:.6rem 0; border-radius:0 .5rem .5rem 0}
.leak-top{display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; font-weight:600}
.leak ul{margin:.35rem 0 0; padding-left:1.1rem; color:var(--ink)}
.leak .yr{color:var(--muted); font-weight:400}

.bars{margin-top:1rem}
.row{display:grid; grid-template-columns:minmax(8rem,11rem) 1fr 6.5rem; gap:.75rem; align-items:center; padding:.3rem 0}
.row .label{font-size:.95rem}
.track{background:var(--bar-bg); height:.7rem; border-radius:.35rem; overflow:hidden}
.fill{background:var(--bar); height:100%}
.row .amt{text-align:right; font-size:.95rem}
@media (max-width:30rem){ .row{grid-template-columns:1fr 5.5rem} .track{grid-column:1 / -1; order:3} }

table{width:100%; border-collapse:collapse; font-size:.95rem}
.scroll{overflow-x:auto; margin-top:1rem}
th,td{text-align:left; padding:.55rem .5rem; border-bottom:1px solid var(--line); vertical-align:middle}
th{font-weight:500; color:var(--muted)}
td.r,th.r{text-align:right}
select{font:inherit; padding:.35rem .4rem; border:1px solid var(--line); border-radius:.4rem; background:var(--panel); color:var(--ink); max-width:12rem}
.save{font:inherit; font-size:.9rem; padding:.35rem .7rem; border-radius:.4rem; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer}
.saved{color:var(--bar); font-size:.9rem}
details{margin-top:2.5rem} summary{cursor:pointer; font-weight:600}
@media (max-width:30rem){ table{font-size:.88rem} th,td{padding:.5rem .3rem} select{max-width:8rem} }
.meta{color:var(--muted); font-size:.9rem; margin-top:3rem; border-top:1px solid var(--line); padding-top:1rem}
</style>
</head>
<body>
<main>
  <h1>Where did your money go?</h1>
  <p class="lede">Upload a bank statement CSV. Every UPI, card and auto-debit payment gets sorted into a category, and recurring charges you might not want are pointed out.</p>
  <div class="controls">
    <label class="primary" tabindex="0">Upload statement CSV<input type="file" id="file" accept=".csv,text/csv"></label>
    <button class="secondary" id="sample">Try a sample statement</button>
  </div>
  <p class="hint">Columns needed: date, narration, and debit + credit (or amount + type).
    <a href="/sample.csv" download="dummy_statement.csv">Download the sample CSV</a> to see the format.
    <button class="link" id="reset" type="button">Forget my corrections</button></p>
  <div class="error" id="err" role="alert"></div>
  <section id="out" aria-live="polite"></section>
</main>

<script>
const NAMES = {food_delivery:"Food delivery", groceries:"Groceries", dining_out:"Eating out", shopping:"Shopping", fuel:"Fuel",
  travel_transport:"Travel and transport", rent:"Rent", emi_loan:"Loan EMIs", credit_card_payment:"Credit card bills",
  utilities:"Electricity, water, gas", mobile_internet:"Mobile and internet", subscriptions:"Subscriptions", insurance:"Insurance",
  investments:"Investments and SIPs", health:"Health", education:"Education", cash_withdrawal:"Cash withdrawals",
  transfer_to_person:"Sent to people", fees_charges:"Bank charges", other:"Other",
  salary_income:"Salary and income", refund_cashback:"Refunds and cashback", interest_dividend:"Interest", transfer_from_person:"Received from people", other_income:"Other income"};
const PERIOD = {weekly:"week", monthly:"month", quarterly:"quarter", yearly:"year"};
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let current = null;

$("file").addEventListener("change", async e => { const f = e.target.files[0]; if (f) analyse(await f.text()); });
$("sample").onclick = async () => analyse(await (await fetch("/sample.csv")).text());
fetch("/api/config").then(r => r.json()).then(c => {
  // UI config is intentionally minimal; the server still enforces the limits.
}).catch(() => {});
$("reset").onclick = async () => {
  const r = await fetch("/api/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
  $("reset").textContent = r.ok ? "Corrections forgotten" : "Couldn't reset";
  setTimeout(() => $("reset").textContent = "Forget my corrections", 2500);
};

async function analyse(csv) {
  $("err").textContent = ""; $("out").innerHTML = `<p class="hint">Sorting transactions…</p>`;
  const t0 = performance.now();
  try {
    const r = await fetch("/api/analyse", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({csv})});
    const body = await r.text();
    let d;
    try { d = JSON.parse(body); }
    catch { throw new Error(`a different program answered on this address (HTTP ${r.status}: "${body.slice(0, 60).trim()}"). Check that app.py is what's running on this port`); }
    if (!r.ok) throw new Error(d.error || `server returned ${r.status}`);
    current = d; render(d, performance.now() - t0);
  } catch (e) { $("out").innerHTML = ""; $("err").textContent = "Couldn't read that statement: " + e.message; }
}

function render(d, ms) {
  const tx = d.transactions, dates = tx.map(t => t.date).sort();
  const fmt = s => new Date(s).toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  const leaks = d.recurring.filter(r => r.flags.length);
  const headline = leaks.length
    ? `You pay ${inr(d.leaks.annual_cost)} a year for ${leaks.length} recurring ${leaks.length === 1 ? "charge" : "charges"} worth a second look.`
    : `No recurring charges stood out. Your subscriptions come to ${inr(d.subscriptions_annual)} a year.`;
  const max = Math.max(...Object.values(d.totals), 1);
  const review = tx.filter(t => t.needs_review);
  const seen = new Set(), reviewUnique = review.filter(t => { const k = t.merchant_key + t.direction; if (seen.has(k)) return false; seen.add(k); return true; });

  $("out").innerHTML = `
    <p class="headline num">${headline}</p>
    <p class="total num">Total spent: <strong>${inr(d.spend)}</strong></p>
    <p class="period num">${fmt(dates[0])} to ${fmt(dates.at(-1))}. Money received: ${inr(d.income)}.</p>

    ${leaks.length ? `<ul class="leaks">${leaks.map(r => `
      <li class="leak"><div class="leak-top num"><span>${esc(r.payee)}</span>
        <span>${inr(r.latest_amount)} a ${PERIOD[r.period]} <span class="yr">(${inr(r.annual_cost)} a year)</span></span></div>
        <ul>${r.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></li>`).join("")}</ul>` : ""}

    <h2>Spending by category</h2>
    <div class="bars">${Object.entries(d.totals).map(([k, v]) => `
      <div class="row num"><span class="label">${NAMES[k] || k}</span>
        <div class="track" aria-hidden="true"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%"></div></div>
        <span class="amt">${inr(v)}</span></div>`).join("")}</div>

    ${reviewUnique.length ? `<h2>Check these payees</h2>
      <p class="sub">We weren't sure about these. Pick the right category once, and future payments to the same payee will use it.</p>
      <div class="scroll"><table><thead><tr><th>Payee</th><th class="r">Amount</th><th>Category</th><th></th></tr></thead><tbody>
      ${reviewUnique.map(t => `<tr data-key="${esc(t.merchant_key)}" data-dir="${t.direction}">
        <td>${esc(t.payee || t.narration.slice(0, 40))}</td><td class="r num">${inr(t.amount)}</td>
        <td><select aria-label="Category for ${esc(t.payee)}">${d.categories[t.direction].map(c =>
          `<option value="${c}" ${c === t.category ? "selected" : ""}>${NAMES[c] || c}</option>`).join("")}</select></td>
        <td><button class="save">Save</button></td></tr>`).join("")}</tbody></table></div>` : ""}

    <details><summary>All recurring payments (${d.recurring.length})</summary>
      <div class="scroll"><table><thead><tr><th>Payee</th><th>Type</th><th class="r">Per charge</th><th class="r">Per year</th></tr></thead><tbody>
      ${d.recurring.map(r => `<tr><td>${esc(r.payee)}</td><td>${r.service_type === "essential" ? "Essential" : esc(r.service_type.replace(/_/g, " "))}</td>
        <td class="r num">${inr(r.latest_amount)}/${PERIOD[r.period]}</td><td class="r num">${inr(r.annual_cost)}</td></tr>`).join("")}
      </tbody></table></div></details>

    <p class="meta num">${d.stats.transactions} transactions sorted in ${ms < 1000 ? Math.round(ms) + " ms" : (ms / 1000).toFixed(1) + " s"} with ${d.stats.jev_calls} calls to ${esc(d.stats.model)}${d.stats.model === "MOCK" ? " (demo answers, not the real model)" : ""}.
      ${d.stats.by_rule} were handled by rules and ${d.stats.by_memory} by payees it already knew. Model cost for this statement: $${d.stats.cost_usd.toFixed(5)}.</p>`;

  document.querySelectorAll(".save").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr"), sel = tr.querySelector("select");
    b.disabled = true;
    const r = await fetch("/api/correct", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({merchant_key:tr.dataset.key, direction:tr.dataset.dir, category:sel.value})});
    b.outerHTML = r.ok ? `<span class="saved">Saved</span>` : `<span class="error">Not saved</span>`;
  });
}
</script>
</body>
</html>
